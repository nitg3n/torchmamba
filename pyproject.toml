[project]
name = "torchmamba"
version = "0.1.2"
description = "Clean PyTorch reference kernels for Mamba-1/2/3 (S6, SSD, SISO, MIMO) — parity with paper math"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["mamba", "state-space-models", "ssm", "pytorch", "reference"]
authors = [
    { name = "Jaeha Han", email = "jay@nitg3n.xyz" }
]
maintainers = [
    { name = "Jaeha Han", email = "jay@nitg3n.xyz" }
]
dependencies = [
    "torch>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/nitg3n/torchmamba"
Repository = "https://github.com/nitg3n/torchmamba"
Documentation = "https://github.com/nitg3n/torchmamba#readme"
Changelog = "https://github.com/nitg3n/torchmamba/releases"
Issues = "https://github.com/nitg3n/torchmamba/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "build>=1.0.0",
    "twine>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "torchmamba"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
